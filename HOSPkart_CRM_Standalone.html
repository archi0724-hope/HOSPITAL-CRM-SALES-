function filterSelect(key,label,options,defaultLabel='All',fixed=''){let val=fixed||state.filters[key]||'';return`<label>${label}<select data-filter="${key}" ${fixed?'disabled':''}><option value="">${esc(defaultLabel)}</option>${options.map(o=>`<option ${val===o?'selected':''} value="${esc(o)}">${esc(o)}</option>`).join('')}</select></label>`;}
function filters(fixed=''){return`<section class="panel filters" aria-label="Meeting filters">${filterSelect('employee','Employee',[...new Set([...EMPLOYEES,...db.employee.map(r=>r.name)])],'All Employees')}${filterSelect('location','Location',[...new Set([...LOCATIONS,...db.location.map(r=>r.name)])],'All Locations')}<label>From Date<input type="date" data-filter="from" value="${esc(state.filters.from||'')}"></label><label>To Date<input type="date" data-filter="to" value="${esc(state.filters.to||'')}"></label>${filterSelect('type','Meeting Type',['Hospital','Vendor'],'All',fixed)}${filterSelect('meetingStatus','Meeting Status',MEETING_STATUS)}${filterSelect('status','Status',RECORD_STATUS)}<button data-action="clear">Clear Filters</button></section>`;}
function filtered(list=rows()){
 let f=state.filters,fixed=SCHEMAS[state.route]?.fixedType;
 return list.filter(r=>(!fixed||r.type===fixed)&&(!f.employee||r.employee===f.employee)&&(!f.location||r.location===f.location)&&(!f.type||r.type===f.type)&&(!f.meetingStatus||r.meetingStatus===f.meetingStatus)&&(!f.status||String(r.status)===f.status||r.payment===f.status)&&(!f.from||r.created>=f.from)&&(!f.to||r.created.slice(0,10)<=f.to)&&(!f.facility||r.facility===f.facility)&&(!f.payment||r.payment===f.payment)&&(!f.deliveryStatus||r.deliveryStatus===f.deliveryStatus)&&(!f.plan||r.plan===f.plan)&&(!f.auditType||r.auditType===f.auditType)&&(!f.city||r.city===f.city)&&Object.values(r).some(v=>String(v).toLowerCase().includes(state.search.toLowerCase()))).sort((a,b)=>{let av=a[state.sort],bv=b[state.sort];return (typeof av==='number'&&typeof bv==='number'?av-bv:String(av??'').localeCompare(String(bv??''),undefined,{numeric:true}))*(state.desc?-1:1);});
}
function quoteTotal(q){if(Number.isFinite(q.totalAmount))return q.totalAmount;return(q.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0)*(1+(+i.gst||0)/100),0);}
function localSummary(list){let fs=list.flatMap(r=>r.followups||[]),qs=list.flatMap(r=>r.quotations||[]),status={};for(let s of MEETING_STATUS)status[s]=list.filter(r=>r.meetingStatus===s).length;return{meetings:list.length,followups:fs.length,scheduled:fs.filter(f=>f.status==='Scheduled').length,quotations:qs.length,pending:qs.filter(q=>q.status==='Pending').length,value:qs.reduce((s,q)=>s+quoteTotal(q),0),accepted:qs.filter(q=>q.status==='Accepted').length,overdue:fs.filter(f=>f.status==='Scheduled'&&f.date<today()).length,expired:qs.filter(q=>q.status==='Shared'&&q.validUntil<today()).length,status};}
function stat(label,value,sub,ico,idx){return`<div class="panel stat"><small>${label}</small><strong>${value}</strong>${sub?`<p>${sub}</p>`:''}<span class="stat-icon">${icon(ico)}</span></div>`;}
function dashboard(){let list=filtered(db['sales-meeting']),s=state.snapshot?SNAPSHOT:localSummary(list);let statuses=Object.entries(s.status),colors=['#ab46ef','#11b95d','#3182f6','#f3ba0a','#12aaa0','#e5666a'];
 let overdue=list.flatMap(r=>(r.followups||[]).filter(f=>f.status==='Scheduled'&&f.date<today()).map(f=>({r,f}))),expired=list.flatMap(r=>(r.quotations||[]).filter(q=>q.validUntil<today()&&q.status==='Shared').map(q=>({r,q})));let end=new Date();end.setDate(end.getDate()+7);let weekEnd=end.toISOString().slice(0,10);let upcoming=list.flatMap(r=>(r.followups||[]).filter(f=>f.status==='Scheduled'&&f.date>=today()&&f.date<=weekEnd).map(f=>({r,f})));
 return`<div class="pagehead"><div><h1>Sales Meeting Dashboard</h1><p>Overview of your sales pipeline and activities</p></div><div class="actions"><button class="outline" data-action="export">${icon('download')}Export Excel</button><a class="btn outline" href="${link('sales-meeting')}">${icon('list')}All Meetings</a></div></div><div class="notice"><span>${state.snapshot?'Reference dashboard totals observed 31 Oct 2026. Lists below use sample records.':'Local totals calculated from the sample records and your saved changes.'}</span><button data-action="snapshot">${state.snapshot?'Use local totals':'Show observed snapshot'}</button></div>${filters()}<div class="stats">${stat('Total Meetings',s.meetings,'','chart')}${stat('Follow-ups',s.followups,s.scheduled+' scheduled','file')}${stat('Quotations',s.quotations,s.pending+' pending','file')}${stat('Quotation Value',money(s.value),s.accepted+' accepted','rupee')}</div><div class="dashboardgrid"><section class="panel"><h3>${icon('shield')} Alerts & Notifications</h3><a href="${link('sales-meeting')}" class="alert">${icon('alert')}${s.overdue} overdue follow-ups need attention<span class="counter">${s.overdue}</span></a><div class="alert amber">${icon('alert')}${s.expired} quotations expired without response<span class="counter">${s.expired}</span></div><a class="alert blue" href="${link('sales-meeting')}?meetingStatus=Pending">${icon('shield')}${s.status.Pending||0} meetings still pending<span class="counter">${s.status.Pending||0}</span></a></section><section class="panel"><h3>${icon('chart')} Meeting Status</h3>${statuses.map(([name,count],i)=>`<div class="progressrow"><div><span>${name}</span><small>${count} (${s.meetings?Math.round(count/s.meetings*100):0}%)</small></div><div class="track"><i style="width:${s.meetings?count/s.meetings*100:0}%;background:${colors[i%6]}"></i></div></div>`).join('')}</section></div><div class="twocol"><section class="panel"><h3>Overdue Follow-ups <span class="badge">Local records</span></h3>${overdue.length?overdue.map(({r,f})=>`<a class="listrow" href="${link('sales-meeting',r.id)}"><div>${esc(r.name)}<small>${esc(f.type)} · ${r.type}</small></div><span class="tag red">${Math.floor((new Date(today())-new Date(f.date))/86400000)} days overdue</span></a>`).join(''):'<p class="empty">No overdue follow-ups in local records.</p>'}</section><section class="panel"><h3>Upcoming This Week</h3>${upcoming.length?upcoming.map(({r,f})=>`<a class="listrow" href="${link('sales-meeting',r.id)}">${esc(r.name)}<small>${date(f.date)}</small></a>`).join(''):'<p class="empty">No follow-ups scheduled this week</p>'}</section></div><div class="twocol"><section class="panel"><h3>Expired Quotations <span class="badge">Local records</span></h3>${expired.length?expired.map(({r,q})=>`<a class="listrow" href="${link('sales-meeting',r.id)}"><div>${esc(q.id)} ${badge(q.status)}<small>${esc(r.name)}</small></div><div>${money(quoteTotal(q))}<small>Expired ${date(q.validUntil)}</small></div></a>`).join(''):'<p class="empty">No expired quotations</p>'}</section><section class="panel"><h3>Recent Meetings <a class="badge" href="${link('sales-meeting')}">View all</a></h3>${[...list].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5).map(r=>`<a class="listrow" href="${link('sales-meeting',r.id)}"><div>${esc(r.name)}<small>${esc(r.type)} · ${esc(r.location)} · ${esc(r.employee)}</small></div><div>${badge(r.meetingStatus)}<small>${date(r.created)}</small></div></a>`).join('')||'<p class="empty">No meetings match your filters</p>'}</section></div><section class="panel"><h3>Quotation Pipeline <span class="badge">Local records</span></h3><div class="pipeline">${['Pending','Shared','Accepted','Rejected'].map(status=>`<div><strong>${list.flatMap(r=>r.quotations||[]).filter(q=>q.status===status).length}</strong>${badge(status)}</div>`).join('')}</div></section>`;
}
function cell(r,k){let v=r[k];if(k==='name'&&SCHEMAS[state.route]?.meeting)return`<a href="${link('sales-meeting',r.id)}">${esc(v)}</a>`;if(['status','meetingStatus','leadStatus','campaignStatus','payment','deliveryStatus'].includes(k))return badge(v);if(['amount','total','hopePrice','price'].includes(k))return`<span class="money">${money(v)}</span>`;if(['created','delivery'].includes(k))return date(v);if(['updates','documents','quotations','followups'].includes(k))return esc((v||[]).length);if(k==='image')return v?`<img class="attachment" src="${esc(v)}" alt="Record image">`:'—';if(typeof v==='boolean')return v?'Yes':'No';if(Array.isArray(v))return esc(v.map(x=>typeof x==='object'?Object.values(x).join(': '):x).join(', '))||'—';if(k==='contact'&&SCHEMAS[state.route]?.meeting)return`${esc(v||'—')}<small style="display:block">${esc(r.phone||'')}</small>`;return esc(v??'—');}

function commitSections(next){
 const previous=db.section;db.section=next;
 if(save())return true;
 db.section=previous;return false;
}
function validateSection(data){
 if(!String(data.name||'').trim())throw Error('Enter a section name.');
 if(!String(data.routes||'').trim())throw Error('Enter a route or * for all routes.');
 if(!String(data.routes).split(/[\n,]+/).every(v=>v.trim()==='*'||/^\/\S*$/.test(v.trim())))throw Error('Routes must start with /, or use *. Separate multiple routes with commas or new lines.');
 if(!Number.isSafeInteger(data.order)||data.order<0)throw Error('Order must be a whole number of zero or greater.');
 if(!RECORD_STATUS.includes(data.status))throw Error('Select a valid section status.');
}
function saveSectionRecord(data,id){
 validateSection(data);const next=structuredClone(db.section),existing=next.find(r=>r.id===id);
 if(id&&!existing)throw Error('This section no longer exists. Refresh and retry.');
 if(existing)Object.assign(existing,data,{updated:today()});
 else next.push({id:Math.max(0,...next.map(r=>r.id))+1,...data,created:today()});
 if(!commitSections(next))throw Error('Section was not saved. Check browser storage and retry.');
}
function updateSectionField(input){
 const row=db.section.find(r=>r.id===Number(input.dataset.id));if(!row)return;
 if(!input.checkValidity()){input.reportValidity();input.value=row[input.dataset.sectionField];return;}
 const field=input.dataset.sectionField,value=field==='order'?Number(input.value):input.value;
 try{saveSectionRecord({...row,[field]:value},row.id);sidebar();renderMain();toast(field==='order'?'Section order saved.':'Section status saved.');}
 catch(error){input.value=row[field];toast(error.message);}
}

async function collectFields(fields,form,original={}){let data={};for(const f of fields){let input=form.elements.namedItem(f.key);if(['pairs','tiers'].includes(f.type)){data[f.key]=[...form.querySelectorAll(`[data-repeat="${f.key}"] .repeatrow`)].map(row=>({a:row.querySelector('[data-part="a"]').value,b:row.querySelector('[data-part="b"]').value}));continue;}if(!input||f.type==='password')continue;if(f.type==='checkbox')data[f.key]=input.checked;else if(f.type==='multiselect')data[f.key]=[...input.selectedOptions].map(o=>o.value);else if(['image','gallery','file'].includes(f.type)){if(input.files.length){if(f.type==='gallery'&&input.files.length>8)throw Error('Choose up to 8 gallery images.');for(const file of input.files)if(f.type!=='file'&&!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Select a PNG, JPEG or WEBP image.');data[f.key]=f.type==='gallery'?await Promise.all([...input.files].map(readFile)):await readFile(input.files[0]);if(f.type==='file')data.fileName=input.files[0].name;}else data[f.key]=original[f.key]||'';}else data[f.key]=f.type==='number'?Number(input.value):input.value.trim();}return data;}

document.addEventListener('change',event=>{let el=event.target;if(el.matches('[data-section-field]')){updateSectionField(el);return;}if(el.matches('[data-filter]')){state.filters[el.dataset.filter]=el.value;state.page=1;state.snapshot=false;if(state.filters.from&&state.filters.to&&state.filters.from>state.filters.to){state.filters.to=state.filters.from;toast('End date adjusted to the start date.');}renderMain();}if(el.id==='page-size'){state.size=Number(el.value);state.page=1;renderMain();}if(el.dataset.column){let k=el.dataset.column;state.hidden[state.route]??=[];state.hidden[state.route]=state.hidden[state.route].filter(x=>x!==k);if(!el.checked)state.hidden[state.route].push(k);renderMain();}if(el.matches('[data-quote-status]')){meeting().quotations[Number(el.dataset.quoteStatus)].status=el.value;save();toast('Quotation status saved locally.');}});
document.addEventListener('input',event=>{let el=event.target;if(el.id==='global-search')searchResults(el.value);if(el.id==='table-search'){state.search=el.value;state.page=1;let pos=el.selectionStart;renderMain();let input=$('#table-search');input.focus();input.setSelectionRange(pos,pos);}if(el.matches('[data-qi]')){let n=Number(el.closest('[data-quote-row]').dataset.quoteRow),key=el.dataset.qi;quoteDraft[n][key]=['gst','qty','price'].includes(key)?Number(el.value):el.value;el.closest('tr').querySelector('[data-line-total]').textContent=money(quoteTotal({items:[quoteDraft[n]]}));$('#quote-total').textContent='Total: '+money(quoteTotal({items:quoteDraft}));}});
document.addEventListener('submit',async event=>{event.preventDefault();let form=event.target;if(form.id==='record-form'){await submitRecord(form);return;}if(form.id==='activity-form'){try{let r=meeting(),data=await collectFields(currentForm.fields,form);if(activityType==='followups'&&data.nextDate&&data.nextDate<data.date)throw Error('Next follow-up date must not be before the follow-up date.');r[activityType]??=[];r[activityType].push(data);if(activityType==='followups'&&data.nextDate)r.followups.push({date:data.nextDate,status:'Scheduled',type:data.type,remarks:'Next follow-up',team:data.team||[]});save();closeModal();renderMain();toast('Saved locally.');}catch(e){$('#form-error').textContent=e.message;}return;}if(form.id==='quotation-form'){let f=new FormData(form),r=meeting();r.quotations??=[];r.quotations.push({id:'LOCAL-QTN-'+r.id+'-'+Date.now(),validUntil:f.get('validUntil'),remarks:f.get('remarks'),status:'Pending',items:structuredClone(quoteDraft)});save();closeModal();renderMain();toast('Quotation created locally.');return;}if(form.id==='team-form'){meeting().team=[...form.elements.team.selectedOptions].map(o=>o.value);save();closeModal();renderMain();return;}if(form.id==='settings-form'){db.settings={subscriptionPrice:Number(new FormData(form).get('subscriptionPrice'))};save();toast('Subscription price saved locally. No payment was processed.');return;}if(form.id==='restore-form'){try{let file=form.elements.backup.files[0];if(file.size>20*1024*1024)throw Error('Backup is too large (max 20 MB).');let backup=JSON.parse(await file.text());if(backup.format!=='hospkart-crm-local-v1'||!backup.data)throw Error('Invalid HOSPkart backup format.');for(let k of Object.keys(SCHEMAS).filter(k=>!SCHEMAS[k].meeting||k==='sales-meeting'))if(!Array.isArray(backup.data[k])||backup.data[k].some(r=>!r||typeof r!=='object'||!Number.isFinite(r.id)))throw Error('Backup has missing or invalid records: '+k);db=backup.data;save();closeModal();parseRoute();toast('Local backup restored.');}catch(e){$('#form-error').textContent=e.message;}}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ACTIONS.search();}});
window.addEventListener('hashchange',()=>{if($('#modal').open)closeModal();parseRoute();window.scrollTo({top:0});});
try{if(localStorage.getItem(KEY+'-theme')==='dark')document.body.classList.add('dark');}catch{}
parseRoute();if(!storageOK)toast('Browser storage is unavailable. Use backups to retain your changes.');

loadOriginalSalesReport();

// Global QuoteSaarthi launcher is outside #main, so chat survives navigation.
function initializeQuoteRobot(){
 const launcher=document.createElement('button');launcher.type='button';launcher.className='quote-robot-launcher';launcher.id='quote-robot-launcher';launcher.setAttribute('aria-label','Open AI Assistance robot assistant');launcher.setAttribute('aria-controls','quote-robot-panel');launcher.setAttribute('aria-expanded','false');
 launcher.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 8V4m-2 0h4M6 16H3v7h3m20-7h3v7h-3"/><rect x="6" y="9" width="20" height="19" rx="6"/><circle cx="12" cy="17" r="1.5"/><circle cx="20" cy="17" r="1.5"/><path d="M12 23h8"/></svg><span class="quote-robot-label">Ask AI Assistance</span>';
 const panel=document.createElement('section');panel.id='quote-robot-panel';panel.className='quote-robot-panel';panel.hidden=true;panel.setAttribute('aria-label','AI Assistance robot assistant');
 const loading=document.createElement('div');loading.className='quote-robot-loading';loading.setAttribute('role','status');loading.textContent='Opening AI Assistance…';panel.appendChild(loading);
 let frame=null,timeout=null;
 const theme=()=>{if(frame?.contentWindow)frame.contentWindow.postMessage({type:'crm-theme',dark:document.body.classList.contains('dark')},location.origin);};
 function syncWorkspaceContext(){
  if(!frame?.contentWindow||loading.hidden===false)return;
  const current_view=state.route==='operations'?(state.filters.module||'dashboard'):'dashboard';
  frame.contentWindow.postMessage({type:'crm-assistant-context',context:{current_view,selected_client:null}},location.origin);
  const operations=$('#operations-frame');
  if(state.route==='operations'&&operations?.contentWindow)operations.contentWindow.postMessage({type:'crm-assistant-context-request'},location.origin);
 }
 window.addEventListener('hashchange',syncWorkspaceContext);
 window.addEventListener('message',event=>{
  const operations=$('#operations-frame');
  if(event.origin!==location.origin||!operations||event.source!==operations.contentWindow||!frame?.contentWindow)return;
  if(event.data?.type==='crm-assistant-context-response'&&state.route==='operations')frame.contentWindow.postMessage({type:'crm-assistant-context',context:event.data.context},location.origin);
  if(event.data?.type==='crm-counts-changed'){frame.contentWindow.postMessage({type:'crm-workspace-updated'},location.origin);syncWorkspaceContext();}
 });
 function close(){panel.hidden=true;launcher.setAttribute('aria-expanded','false');launcher.focus();}
 function open(){
  panel.hidden=false;launcher.setAttribute('aria-expanded','true');
  if(location.protocol==='file:'){loading.textContent='Open http://localhost:5500 to use AI Assistance.';return;}
  if(!frame){
   frame=document.createElement('iframe');frame.title='AI Assistance';frame.src='/operations/?view=assistant&embedded=1&widget=1&theme='+(document.body.classList.contains('dark')?'dark':'light');panel.appendChild(frame);
   frame.addEventListener('load',theme);
   timeout=setTimeout(()=>{if(!loading.hidden){loading.textContent='AI Assistance could not finish loading. Check localhost and retry.';const retry=document.createElement('button');retry.textContent='Retry';retry.onclick=()=>{frame.remove();frame=null;loading.textContent='Opening AI Assistance…';open();};loading.appendChild(retry);}},25000);
  }else if(loading.hidden){frame.contentWindow.postMessage({type:'crm-module',view:'assistant'},location.origin);frame.focus();}
  theme();syncWorkspaceContext();
 }
 launcher.addEventListener('click',()=>panel.hidden?open():close());
 window.addEventListener('message',event=>{
  if(event.origin!==location.origin||!frame||event.source!==frame.contentWindow)return;
  if(event.data?.type==='crm-ready'){clearTimeout(timeout);loading.hidden=true;theme();syncWorkspaceContext();if(!panel.hidden)frame.focus();}
  if(event.data?.type==='crm-assistant-close')close();
 });
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!panel.hidden)close();});
 new MutationObserver(theme).observe(document.body,{attributes:true,attributeFilter:['class']});
 document.body.append(panel,launcher);
}
initializeQuoteRobot();

</script></body></html>
